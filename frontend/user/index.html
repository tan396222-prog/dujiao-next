<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      background: #efe6ff;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(420px 340px at 22% 28%, rgba(164, 98, 255, 0.96), transparent 62%),
        radial-gradient(380px 300px at 46% 24%, rgba(255, 148, 206, 0.88), transparent 64%),
        radial-gradient(360px 280px at 72% 30%, rgba(126, 196, 255, 0.86), transparent 64%),
        linear-gradient(165deg, #f7f3ff 0%, #efe3ff 46%, #f6f1ff 100%);
    }
    #boot .knot-stage {
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      border-radius: 28px;
      color: #5b3d92;
      background: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 18px 40px -24px rgba(86, 48, 150, 0.7);
    }
    #boot .knot-spin {
      width: 48px;
      height: 48px;
      transform-origin: center;
      animation: gpt-knot-spin 2.8s linear infinite;
    }
    #boot.is-stalled .knot-spin {
      animation: none;
    }
    #boot-fail {
      margin: 18px 0 0;
      text-align: center;
      color: #3e3458;
      font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    #boot-fail button {
      display: block;
      margin: 10px auto 0;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      color: #3e3458;
      font: inherit;
      padding: 8px 16px;
    }
    @keyframes gpt-knot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .knot-spin { animation: none; }
    }
  </style>
</head>

<body>
  <div id="boot" role="status" aria-live="polite" aria-busy="true">
    <div>
      <div class="knot-stage">
        <svg class="knot-spin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5828a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142-.0852 4.783-2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685V16.6a.0836.0836 0 0 1-.0315.0617L7.8924 19.9502a4.4992 4.4992 0 0 1-6.2934-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5973 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1635a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4999v2.9994l-2.5974 1.4997-2.6067-1.4997z" />
        </svg>
      </div>
      <p id="boot-fail" hidden></p>
    </div>
  </div>
  <div id="app"></div>
  <script>
    (function () {
      var boot = document.getElementById('boot')
      var app = document.getElementById('app')
      if (!boot || !app) return
      var hide = function () {
        if (app.childElementCount > 0) boot.remove()
      }
      new MutationObserver(hide).observe(app, { childList: true })
      window.setTimeout(function () {
        if (!boot.isConnected) return
        if (app.childElementCount > 0) {
          boot.remove()
          return
        }
        boot.classList.add('is-stalled')
        boot.setAttribute('aria-busy', 'false')
        var fail = document.getElementById('boot-fail')
        if (!fail) return
        var lang = (navigator.language || '').toLowerCase()
        var zh = lang.indexOf('zh') === 0
        var traditional = lang.indexOf('tw') !== -1 || lang.indexOf('hk') !== -1 || lang.indexOf('hant') !== -1
        fail.hidden = false
        fail.textContent = zh ? (traditional ? '載入沒有完成' : '加载没有完成') : "Couldn't load"
        var button = document.createElement('button')
        button.type = 'button'
        button.textContent = zh ? (traditional ? '重試' : '重试') : 'Retry'
        button.addEventListener('click', function () { window.location.reload() })
        fail.appendChild(button)
      }, 12000)
    })()
  </script>
  <script type="module" data-cfasync="false" src="/src/main.ts"></script>
</body>

</html>
